<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d16">
    <title>Otgonjargal Murun | Computer Engineering Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-main: #090d16;
            --bg-card: rgba(17, 24, 39, 0.78);
            --bg-card-hover: rgba(30, 41, 59, 0.92);
            --surface: rgba(15, 23, 42, 0.82);
            --primary: #3b82f6;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(56, 189, 248, 0.5);
            --success: #34d399;
            --input-bg: rgba(2, 6, 23, 0.55);
            --shadow: rgba(0, 0, 0, 0.25);
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg-main: #f4f8fc;
            --bg-card: rgba(255, 255, 255, 0.88);
            --bg-card-hover: #ffffff;
            --surface: rgba(255, 255, 255, 0.92);
            --text-main: #172033;
            --text-muted: #526179;
            --border: rgba(30, 41, 59, 0.14);
            --border-hover: rgba(2, 132, 199, 0.48);
            --success: #047857;
            --input-bg: #ffffff;
            --shadow: rgba(31, 41, 55, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.13) 0%, transparent 45%), radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.1) 0%, transparent 45%);
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: linear-gradient(to right, rgba(100, 116, 139, 0.035) 1px, transparent 1px), linear-gradient(to bottom, rgba(100, 116, 139, 0.035) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: -1;
        }
        a { text-decoration: none; }
        button, input, textarea { font: inherit; }
        button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        nav {
            position: sticky; top: 1rem; max-width: 960px; margin: 0 auto; padding: 0.85rem 1.25rem 0.85rem 1.75rem;
            background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 999px; display: flex; justify-content: space-between; align-items: center; gap: 1rem; z-index: 100;
        }
        .nav-logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1rem; color: var(--text-main); letter-spacing: -0.5px; white-space: nowrap; }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 1.25rem; align-items: center; }
        .nav-links a { color: var(--text-muted); font-size: 0.88rem; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: var(--text-main); }
        .theme-toggle { background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; color: var(--text-main); padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
        .theme-toggle:hover { border-color: var(--border-hover); }
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        header { text-align: center; padding: 5.5rem 1rem 4.5rem; animation: fadeUp 0.8s ease-out; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.25); border-radius: 999px; color: #0891b2; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-bottom: 1.5rem; }
        :root:not([data-theme="light"]) .status-badge { color: #67e8f9; }
        .status-dot { width: 8px; height: 8px; background-color: #22d3ee; border-radius: 50%; box-shadow: 0 0 8px #22d3ee; }
        header h1 { font-size: clamp(2.5rem, 5vw, 3.75rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 1rem; background: linear-gradient(135deg, var(--text-main) 30%, var(--text-muted) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p.subtitle { font-size: 1.25rem; font-weight: 500; color: #0284c7; margin-bottom: 1.25rem; }
        :root:not([data-theme="light"]) header p.subtitle { color: #38bdf8; }
        header p.bio { max-width: 620px; margin: 0 auto 2.25rem; color: var(--text-muted); font-size: 1.05rem; }
        .hero-actions { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .btn-primary { display: inline-block; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 0.8rem 1.75rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; transition: transform 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25); border: 0; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6, 182, 212, 0.35); }
        .btn-secondary { display: inline-block; background: var(--bg-card); color: var(--text-main); padding: 0.8rem 1.75rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; border: 1px solid var(--border); transition: background 0.2s ease, border-color 0.2s ease; }
        .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-hover); }
        section { margin-bottom: 4rem; scroll-margin-top: 6rem; }
        .section-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
        .section-header h2 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; }
        .section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-hover), transparent); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; text-align: center; transition: transform 0.25s ease, border-color 0.25s ease; }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--border-hover); }
        .stat-card .value { display: block; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.25rem; }
        .stat-card .label { color: var(--text-muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .skill-card { background: var(--bg-card); border: 1px solid var(--border); padding: 1.25rem; border-radius: 12px; transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease; }
        .skill-card:hover { transform: translateY(-3px); border-color: var(--border-hover); background: var(--bg-card-hover); }
        .skill-title { font-weight: 600; font-size: 1rem; color: var(--text-main); margin-bottom: 0.35rem; }
        .skill-desc { font-size: 0.85rem; color: var(--text-muted); }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1.25rem 0 1.5rem; }
        .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 0.6rem 0.9rem; border-radius: 999px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .filter-btn.active, .filter-btn:hover { color: var(--text-main); border-color: var(--border-hover); background: rgba(59, 130, 246, 0.12); }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
        .project-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.6rem; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; position: relative; overflow: hidden; }
        .project-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0; transition: opacity 0.25s ease; }
        .project-card:hover { transform: translateY(-4px); border-color: var(--border-hover); box-shadow: 0 16px 30px -15px var(--shadow); }
        .project-card:hover::before { opacity: 1; }
        .project-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .folder-icon { color: #0284c7; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; background: rgba(56, 189, 248, 0.1); padding: 0.35rem 0.75rem; border-radius: 6px; }
        :root:not([data-theme="light"]) .folder-icon { color: #38bdf8; }
        .project-card h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.65rem; color: var(--text-main); }
        .project-card p { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 1rem; }
        .tech-tags { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.2rem; }
        .tech-tags span { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-muted); background: rgba(100, 116, 139, 0.12); padding: 0.25rem 0.6rem; border-radius: 4px; }
        .project-details { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 1rem; }
        .project-details summary { color: var(--text-main); cursor: pointer; font-weight: 600; }
        .project-details p { margin: 0.6rem 0 0; }
        .project-actions { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-top: auto; }
        .project-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #0284c7; font-weight: 600; font-size: 0.9rem; transition: gap 0.2s ease, color 0.2s ease; }
        :root:not([data-theme="light"]) .project-link { color: #38bdf8; }
        .project-link:hover { gap: 0.8rem; }
        .highlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .highlight-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.15rem 1.2rem; }
        .highlight-card .label { display: inline-block; color: var(--success); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.5rem; }
        .highlight-card h3 { font-size: 1.1rem; margin-bottom: 0.35rem; }
        .highlight-card p { color: var(--text-muted); font-size: 0.9rem; }
        .timeline { display: grid; gap: 0.85rem; }
        .timeline details { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; }
        .timeline details[open] { border-color: var(--border-hover); }
        .timeline summary { cursor: pointer; color: var(--text-main); font-weight: 650; }
        .timeline p { color: var(--text-muted); margin-top: 0.7rem; font-size: 0.92rem; }
        .contact-form { max-width: 680px; display: grid; gap: 1rem; margin: 0 auto; text-align: left; }
        .contact-form label { display: grid; gap: 0.4rem; color: var(--text-main); font-size: 0.9rem; font-weight: 600; }
        .contact-form input, .contact-form textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 0.9rem; background: var(--input-bg); color: var(--text-main); }
        .contact-form textarea { min-height: 130px; resize: vertical; }
        .contact-form input::placeholder, .contact-form textarea::placeholder { color: var(--text-muted); opacity: 0.8; }
        .contact-form .btn-primary { justify-self: start; }
        .form-note, .form-status { color: var(--text-muted); font-size: 0.85rem; }
        .form-status { min-height: 1.5em; color: var(--success); }
        .cta-box { background: linear-gradient(145deg, var(--bg-card-hover), var(--surface)); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; text-align: center; }
        .cta-box h2 { font-size: 1.85rem; margin-bottom: 0.75rem; }
        .cta-box > p { color: var(--text-muted); max-width: 560px; margin: 0 auto 1.5rem; }
        footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding-top: 2rem; border-top: 1px solid var(--border); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 640px) {
            nav { border-radius: 14px; padding: 0.75rem; flex-wrap: wrap; }
            .nav-links { gap: 0.75rem; }
            .nav-links a { font-size: 0.8rem; }
            .theme-toggle { font-size: 0.75rem; }
            header { padding: 3.5rem 0.5rem 3rem; }
            .project-card { padding: 1.35rem; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const CONTACT_EMAIL = 'moron3331@gmail.com';

        const skills = [
            { title: 'HTML5 & CSS3', description: 'Semantic markup, responsive layouts, CSS Grid & Flexbox' },
            { title: 'JavaScript (ES6+)', description: 'Interactive DOM manipulation, async APIs & modern logic' },
            { title: 'React', description: 'Component-driven UI, reusable interfaces & stateful interactions' },
            { title: 'Python & Data Science', description: 'Regression modeling, data analysis & statistical evaluation' },
            { title: 'Web Accessibility', description: 'WCAG standards, ARIA compliance & accessible interfaces' },
            { title: 'Git & Version Control', description: 'Branching workflows, pull requests & GitHub collaboration' }
        ];

        const stats = [
            { value: '3+', label: 'Years Learning' },
            { value: '12+', label: 'Projects' },
            { value: '100%', label: 'Curiosity' }
        ];

        const projects = [
            {
                folder: '/web-pro', title: 'Web Programming Repository', category: 'Web',
                description: 'Web programming coursework and responsive applications built with HTML5, CSS3, and accessible web standards.',
                details: 'A collection of coursework exploring semantic markup, responsive layouts, and accessible frontend patterns.',
                tags: ['HTML5', 'CSS3', 'JavaScript', 'Accessibility'], link: 'https://github.com/murun05/web-pro'
            },
            {
                folder: '/week11-task11', title: 'Week 11 React Interface', category: 'React',
                description: 'A React student directory app with reusable profile cards, custom styling, and a responsive layout.',
                details: 'This project practices reusable React components and presenting a collection of student profiles in a clear interface.',
                tags: ['React', 'Components', 'CSS', 'JavaScript'], link: 'https://github.com/murun05/week11-task11'
            },
            {
                folder: '/task11', title: 'Student Directory', category: 'React',
                description: 'A student directory built with React, featuring reusable profile cards and custom responsive styling.',
                details: 'The interface focuses on component-based rendering and a responsive card layout for student profiles.',
                tags: ['React', 'JavaScript', 'CSS'], link: 'https://github.com/murun05/task11'
            },
            {
                folder: '/ml', title: 'Machine Learning Coursework', category: 'Data',
                description: 'A repository for machine learning and data science coursework using notebooks and Python.',
                details: 'Explore the repository for the actual notebooks, datasets, and coursework details.',
                tags: ['Python', 'Jupyter', 'Machine Learning'], link: 'https://github.com/murun05/ml'
            },
            {
                folder: '/project', title: 'TypeScript Project', category: 'Web',
                description: 'A TypeScript project demonstrating modern JavaScript tooling and structured application code.',
                details: 'Visit the repository to see its implementation, project goals, and current documentation.',
                tags: ['TypeScript', 'JavaScript'], link: 'https://github.com/murun05/project'
            }
        ];

        const highlights = [
            { label: 'Current focus', title: 'Frontend & web applications', detail: 'Building responsive interfaces with clear structure and user-friendly interactions.' },
            { label: 'Learning', title: 'React and modern UI engineering', detail: 'Practicing reusable components, app state, and component-driven design.' },
            { label: 'Goal', title: 'Show practical work', detail: 'Turning coursework and personal projects into a portfolio for future opportunities.' }
        ];

        const experienceAndEducation = [
            { title: 'Computer Engineering — Gachon University', detail: 'Currently studying Computer Engineering. Building foundations in software development, web programming, and data science.' },
            { title: 'Web programming coursework', detail: 'Course projects include responsive web pages and React interfaces. See the project cards above for repository links.' },
            { title: 'Independent project practice', detail: 'Continuously practicing frontend development, reusable React components, and Git/GitHub workflows through coursework and personal projects.' }
        ];

        const categories = ['All', 'Web', 'React', 'Data'];

        function SkillCard({ title, description }) {
            return <div className="skill-card"><div className="skill-title">{title}</div><div className="skill-desc">{description}</div></div>;
        }

        function StatCard({ value, label }) {
            return <div className="stat-card"><span className="value">{value}</span><span className="label">{label}</span></div>;
        }

        function ProjectCard({ project }) {
            const [expanded, setExpanded] = React.useState(false);
            return (
                <article className="project-card">
                    <div>
                        <div className="project-top"><span className="folder-icon">{project.folder}</span></div>
                        <h3>{project.title}</h3>
                        <p>{project.description}</p>
                        <div className="tech-tags">{project.tags.map((tag) => <span key={tag}>{tag}</span>)}</div>
                        <details className="project-details" open={expanded} onToggle={(event) => setExpanded(event.currentTarget.open)}>
                            <summary>{expanded ? 'Hide project details' : 'More project details'}</summary>
                            <p>{project.details}</p>
                        </details>
                    </div>
                    <div className="project-actions">
                        <a href={project.link} className="project-link" target="_blank" rel="noreferrer">View repository <span aria-hidden="true">&rarr;</span></a>
                    </div>
                </article>
            );
        }

        function App() {
            const [activeFilter, setActiveFilter] = React.useState('All');
            const [theme, setTheme] = React.useState(() => localStorage.getItem('portfolio-theme') || 'dark');
            const [formStatus, setFormStatus] = React.useState('');
            const filteredProjects = activeFilter === 'All' ? projects : projects.filter((project) => project.category === activeFilter);

            React.useEffect(() => {
                document.documentElement.dataset.theme = theme;
                localStorage.setItem('portfolio-theme', theme);
            }, [theme]);

            function handleContactSubmit(event) {
                event.preventDefault();
                const formData = new FormData(event.currentTarget);
                const name = formData.get('name').trim();
                const email = formData.get('email').trim();
                const message = formData.get('message').trim();
                const subject = encodeURIComponent(`Portfolio message from ${name}`);
                const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
                setFormStatus('Your email app should open with the message ready to send.');
                window.location.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
                event.currentTarget.reset();
            }

            return (
                <div className="container">
                    <nav aria-label="Main navigation">
                        <a href="#top" className="nav-logo">murun<span>.dev</span></a>
                        <div className="nav-links">
                            <a href="#skills">Skills</a>
                            <a href="#projects">Projects</a>
                            <a href="#experience">Experience</a>
                            <a href="#contact">Contact</a>
                        </div>
                        <button className="theme-toggle" type="button" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} aria-label={`Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`}>
                            {theme === 'dark' ? '☀ Light' : '☾ Dark'}
                        </button>
                    </nav>

                    <header id="top">
                        <div className="status-badge"><span className="status-dot"></span>Computer Engineering @ Gachon University</div>
                        <h1>Otgonjargal Murun</h1>
                        <p className="subtitle">Software Developer & Data Science Enthusiast</p>
                        <p className="bio">Passionate Computer Engineering undergraduate building accessible web applications, data-driven tools, and responsive digital experiences with clean, maintainable code.</p>
                        <div className="hero-actions">
                            <a href="#projects" className="btn-primary">Explore Projects</a>
                            <a href="https://github.com/murun05" target="_blank" rel="noreferrer" className="btn-secondary">GitHub Profile</a>
                        </div>
                    </header>

                    <section id="skills">
                        <div className="section-header"><h2>Skills & Technologies</h2><div className="section-line"></div></div>
                        <div className="stats-grid">{stats.map((stat) => <StatCard key={stat.label} value={stat.value} label={stat.label} />)}</div>
                        <div className="skills-grid">{skills.map((skill) => <SkillCard key={skill.title} title={skill.title} description={skill.description} />)}</div>
                    </section>

                    <section id="projects">
                        <div className="section-header"><h2>Course & Featured Projects</h2><div className="section-line"></div></div>
                        <div className="filter-bar" role="group" aria-label="Filter projects by category">
                            {categories.map((category) => <button key={category} type="button" className={category === activeFilter ? 'filter-btn active' : 'filter-btn'} aria-pressed={category === activeFilter} onClick={() => setActiveFilter(category)}>{category}</button>)}
                        </div>
                        <div className="projects-grid" aria-live="polite">{filteredProjects.map((project) => <ProjectCard key={project.title} project={project} />)}</div>
                    </section>

                    <section>
                        <div className="section-header"><h2>Portfolio Highlights</h2><div className="section-line"></div></div>
                        <div className="highlight-grid">{highlights.map((item) => <article className="highlight-card" key={item.title}><span className="label">{item.label}</span><h3>{item.title}</h3><p>{item.detail}</p></article>)}</div>
                    </section>

                    <section id="experience">
                        <div className="section-header"><h2>Experience & Education</h2><div className="section-line"></div></div>
                        <div className="timeline">{experienceAndEducation.map((item) => <details key={item.title}><summary>{item.title}</summary><p>{item.detail}</p></details>)}</div>
                    </section>

                    <section className="cta-box" id="contact">
                        <h2>Let's Connect & Build Together</h2>
                        <p>Have a project idea or want to collaborate? Send a message using the form below. It will open your email app so you can review and send it.</p>
                        <form className="contact-form" onSubmit={handleContactSubmit}>
                            <label>Your name<input name="name" type="text" autoComplete="name" placeholder="Your name" required maxLength="100" /></label>
                            <label>Your email<input name="email" type="email" autoComplete="email" placeholder="you@example.com" required maxLength="254" /></label>
                            <label>Message<textarea name="message" placeholder="What would you like to discuss?" required maxLength="2000"></textarea></label>
                            <button className="btn-primary" type="submit">Prepare email</button>
                            <p className="form-note">This form uses your device's email application; it does not send or store information on this website.</p>
                            <p className="form-status" role="status" aria-live="polite">{formStatus}</p>
                        </form>
                    </section>

                    <footer><p>&copy; 2026 Otgonjargal Murun &bull; Built with React</p></footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
