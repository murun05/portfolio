<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <title>Otgonjargal Murun | Computer Engineering Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-main: #090d16;
      --bg-card: rgba(17, 24, 39, .78);
      --bg-card-hover: rgba(30, 41, 59, .92);
      --surface: rgba(15, 23, 42, .88);
      --primary: #3b82f6;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, .1);
      --border-hover: rgba(56, 189, 248, .5);
      --input-bg: rgba(2, 6, 23, .55);
      --shadow: rgba(0, 0, 0, .28);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg-main: #f4f8fc;
      --bg-card: rgba(255, 255, 255, .88);
      --bg-card-hover: #fff;
      --surface: rgba(255, 255, 255, .94);
      --text-main: #172033;
      --text-muted: #526179;
      --border: rgba(30, 41, 59, .14);
      --border-hover: rgba(2, 132, 199, .48);
      --input-bg: #fff;
      --shadow: rgba(31, 41, 55, .12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      overflow-x: hidden; color: var(--text-main); background: var(--bg-main);
      background-image: radial-gradient(circle at 15% 15%, rgba(59,130,246,.13), transparent 45%), radial-gradient(circle at 85% 30%, rgba(6,182,212,.1), transparent 45%);
      font: 16px/1.7 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color .25s, color .25s;
    }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(to right, rgba(100,116,139,.035) 1px, transparent 1px), linear-gradient(to bottom, rgba(100,116,139,.035) 1px, transparent 1px); background-size: 40px 40px; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    nav { position: sticky; top: 1rem; z-index: 10; max-width: 960px; margin: 0 auto; padding: .8rem 1.25rem .8rem 1.7rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); backdrop-filter: blur(12px); }
    .nav-logo { font: 700 1rem 'JetBrains Mono', monospace; white-space: nowrap; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 1.1rem; }
    .nav-links a { color: var(--text-muted); font-size: .86rem; }
    .nav-links a:hover { color: var(--text-main); }
    .theme-toggle { padding: .45rem .7rem; white-space: nowrap; color: var(--text-main); background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; font-size: .82rem; }
    .theme-toggle:hover { border-color: var(--border-hover); }
    .container { max-width: 960px; margin: auto; padding: 2rem 1.5rem 4rem; }
    header { padding: 5rem 1rem 4rem; text-align: center; animation: fadeUp .7s ease-out; }
    .status-badge { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1.5rem; padding: .4rem 1rem; border: 1px solid rgba(6,182,212,.25); border-radius: 999px; background: rgba(6,182,212,.1); color: #67e8f9; font: .8rem 'JetBrains Mono', monospace; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
    header h1 { margin-bottom: 1rem; font-size: clamp(2.5rem, 5vw, 3.75rem); line-height: 1.15; letter-spacing: -.03em; font-weight: 800; background: linear-gradient(135deg, var(--text-main) 30%, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { margin-bottom: 1.2rem; color: #38bdf8; font-size: 1.25rem; font-weight: 500; }
    .bio { max-width: 620px; margin: 0 auto 2rem; color: var(--text-muted); font-size: 1.05rem; }
    .hero-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }
    .btn-primary, .btn-secondary { display: inline-block; padding: .75rem 1.4rem; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; }
    .btn-primary { border: 0; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 4px 20px rgba(59,130,246,.25); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { color: var(--text-main); border: 1px solid var(--border); background: var(--bg-card); }
    section { margin-bottom: 4rem; scroll-margin-top: 6rem; }
    .section-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .section-header h2 { font-size: 1.65rem; letter-spacing: -.02em; }
    .section-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-hover), transparent); }
    .stats-grid, .skills-grid, .folders-grid, .project-list, .timeline { display: grid; gap: 1rem; }
    .stats-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 2rem; }
    .stat-card, .skill-card, .folder-card, .project-card, .timeline details { border: 1px solid var(--border); background: var(--bg-card); border-radius: 14px; }
    .stat-card { padding: 1.2rem; text-align: center; }
    .stat-value { display: block; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { color: var(--text-muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    .skills-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .skill-card { padding: 1.2rem; }
    .skill-card h3 { margin-bottom: .3rem; font-size: 1rem; }
    .skill-card p { color: var(--text-muted); font-size: .85rem; }

    /* Project folders */
    .folders-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 1.5rem; }
    .folder-card { min-height: 128px; padding: 1.1rem; text-align: left; color: var(--text-main); cursor: pointer; transition: transform .2s, border-color .2s, background .2s; }
    .folder-card:hover, .folder-card.selected { transform: translateY(-2px); border-color: var(--border-hover); background: var(--bg-card-hover); }
    .folder-icon-large { display: block; margin-bottom: .45rem; color: var(--accent); font-size: 1.8rem; line-height: 1.2; }
    .folder-name { display: block; font-weight: 700; }
    .folder-count { display: block; color: var(--text-muted); font: .75rem 'JetBrains Mono', monospace; }
    .folder-heading { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; margin: .2rem 0 1rem; }
    .folder-heading h3 { font-size: 1.2rem; }
    .folder-heading span { color: var(--text-muted); font: .78rem 'JetBrains Mono', monospace; }
    .project-list { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 1.6rem; }
    .project-card { padding: 1rem 1.1rem; text-align: left; color: var(--text-main); cursor: pointer; transition: transform .2s, border-color .2s, background .2s; }
    .project-card:hover, .project-card.selected { transform: translateY(-2px); border-color: var(--border-hover); background: var(--bg-card-hover); }
    .project-card h4 { margin: .35rem 0; font-size: 1rem; }
    .project-card p { color: var(--text-muted); font-size: .84rem; }
    .project-card .project-folder-label { color: var(--accent); font: .72rem 'JetBrains Mono', monospace; }
    .project-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .project-tags span { padding: .2rem .55rem; border-radius: 999px; color: var(--text-muted); background: rgba(100,116,139,.12); font: .7rem 'JetBrains Mono', monospace; }

    /* Swipeable featured project card, using the same palette as the rest of the site */
    .carousel-viewport { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--bg-card); box-shadow: 0 18px 35px -22px var(--shadow); touch-action: pan-y; }
    .carousel-track { display: flex; transition: transform .35s ease; will-change: transform; }
    .project-slide { min-width: 100%; padding: 1.6rem; background: radial-gradient(circle at 85% 0%, rgba(6,182,212,.12), transparent 42%), linear-gradient(145deg, var(--bg-card-hover), var(--bg-card)); }
    .carousel-header, .project-caption, .project-slide-actions { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .carousel-header { color: var(--accent); font: .75rem 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .project-hero { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 175px; padding: 1rem 0; }
    .hero-mark { display: grid; place-items: center; flex: 0 0 100px; width: 100px; height: 100px; border: 1px solid var(--border-hover); border-radius: 24px; color: var(--accent); background: rgba(6,182,212,.1); font-size: 3rem; font-weight: 800; }
    .project-hero h3 { max-width: 620px; font-size: clamp(1.8rem, 5vw, 3.5rem); line-height: 1.05; letter-spacing: -.05em; }
    .project-caption { margin-bottom: 1.2rem; color: var(--text-muted); font: .75rem 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: .08em; }
    .project-arrow { color: var(--accent); font-size: 1.7rem; }
    .project-slide-body { display: grid; gap: 1rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .project-slide-body h4 { font-size: clamp(1.7rem, 4vw, 2.8rem); line-height: 1.1; letter-spacing: -.04em; }
    .project-slide-body > p { max-width: 700px; color: var(--text-muted); }
    .slide-actions { display: flex; flex-wrap: wrap; gap: 1.25rem; padding-top: .9rem; border-top: 1px solid var(--border); }
    .slide-actions a { color: var(--text-main); font-weight: 600; }
    .slide-actions a:hover { color: var(--accent); }
    .carousel-controls { display: flex; justify-content: center; align-items: center; gap: 1.2rem; margin-top: 1rem; }
    .arrow-btn { display: grid; place-items: center; width: 50px; height: 50px; border: 1px solid var(--border); border-radius: 50%; color: var(--text-main); background: var(--bg-card); cursor: pointer; font-size: 1.5rem; transition: border-color .2s, background .2s; }
    .arrow-btn:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
    .carousel-status { min-width: 95px; color: var(--text-muted); text-align: center; font: .9rem 'JetBrains Mono', monospace; }
    .carousel-dots { display: flex; justify-content: center; gap: .45rem; margin-top: .6rem; }
    .carousel-dot { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--border-hover); opacity: .45; cursor: pointer; }
    .carousel-dot.active { width: 20px; border-radius: 8px; opacity: 1; background: var(--accent); }

    .timeline { gap: .85rem; }
    .timeline details { padding: 1rem 1.2rem; }
    .timeline details[open] { border-color: var(--border-hover); }
    .timeline summary { cursor: pointer; font-weight: 650; }
    .timeline p { margin-top: .7rem; color: var(--text-muted); font-size: .92rem; }
    .contact-box { padding: 2.5rem 2rem; text-align: center; border: 1px solid var(--border); border-radius: 20px; background: linear-gradient(145deg, var(--bg-card-hover), var(--surface)); }
    .contact-box h2 { margin-bottom: .6rem; font-size: 1.8rem; }
    .contact-box > p { max-width: 560px; margin: 0 auto 1.5rem; color: var(--text-muted); }
    .contact-form { display: grid; gap: 1rem; max-width: 680px; margin: auto; text-align: left; }
    .contact-form label { display: grid; gap: .4rem; font-size: .9rem; font-weight: 600; }
    .contact-form input, .contact-form textarea { width: 100%; padding: .75rem .9rem; border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); background: var(--input-bg); }
    .contact-form textarea { min-height: 125px; resize: vertical; }
    .contact-form .btn-primary { justify-self: start; }
    .form-note, .form-status { color: var(--text-muted); font-size: .83rem; }
    footer { padding-top: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); text-align: center; font-size: .85rem; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) {
      nav { flex-wrap: wrap; border-radius: 14px; padding: .75rem; }
      .nav-links { flex-wrap: wrap; gap: .65rem; }
      .nav-links a { font-size: .78rem; }
      .theme-toggle { font-size: .75rem; }
      header { padding: 3.2rem .4rem 2.8rem; }
      .project-slide { padding: 1.2rem; }
      .project-hero { min-height: 145px; }
      .hero-mark { flex-basis: 68px; width: 68px; height: 68px; border-radius: 18px; font-size: 2.1rem; }
      .project-caption { font-size: .65rem; }
      .contact-box { padding: 1.5rem 1rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const CONTACT_EMAIL = 'moron3331@gmail.com';
    const skills = [
      { title: 'HTML5 & CSS3', description: 'Semantic markup, responsive layouts, CSS Grid & Flexbox' },
      { title: 'JavaScript (ES6+)', description: 'Interactive DOM manipulation, async APIs & modern logic' },
      { title: 'React', description: 'Component-driven UI, reusable interfaces & stateful interactions' },
      { title: 'Python & Data Science', description: 'Regression modeling, data analysis & statistical evaluation' },
      { title: 'Web Accessibility', description: 'WCAG standards, ARIA compliance & accessible interfaces' },
      { title: 'Git & Version Control', description: 'Branching workflows, pull requests & GitHub collaboration' }
    ];
    const stats = [
      { value: '3+', label: 'Years Learning' },
      { value: '12+', label: 'Projects' },
      { value: '100%', label: 'Curiosity' }
    ];
    const projects = [
      { id: 'web-pro', folder: 'Web', title: 'Web Programming Repository', description: 'Web programming coursework and responsive applications built with HTML5, CSS3, and accessible web standards.', details: 'A collection of coursework exploring semantic markup, responsive layouts, and accessible frontend patterns.', tags: ['HTML5', 'CSS3', 'JavaScript', 'Accessibility'], link: 'https://github.com/murun05/web-pro', symbol: '</>' },
      { id: 'week11-task11', folder: 'React', title: 'Week 11 React Interface', description: 'A React student directory app with reusable profile cards, custom styling, and a responsive layout.', details: 'Practices reusable React components and presenting a collection of student profiles in a clear interface.', tags: ['React', 'Components', 'CSS', 'JavaScript'], link: 'https://github.com/murun05/week11-task11', symbol: '⚛' },
      { id: 'task11', folder: 'React', title: 'Student Directory', description: 'A student directory built with React, featuring reusable profile cards and custom responsive styling.', details: 'The interface focuses on component-based rendering and a responsive card layout for student profiles.', tags: ['React', 'JavaScript', 'CSS'], link: 'https://github.com/murun05/task11', symbol: '▦' },
      { id: 'ml', folder: 'Data', title: 'Machine Learning Coursework', description: 'A repository for machine learning and data science coursework using notebooks and Python.', details: 'Explore the repository for the notebooks, datasets, and coursework details.', tags: ['Python', 'Jupyter', 'Machine Learning'], link: 'https://github.com/murun05/ml', symbol: '∑' },
      { id: 'project', folder: 'Web', title: 'TypeScript Project', description: 'A TypeScript project demonstrating modern JavaScript tooling and structured application code.', details: 'Visit the repository to see its implementation, project goals, and current documentation.', tags: ['TypeScript', 'JavaScript'], link: 'https://github.com/murun05/project', symbol: 'TS' }
    ];
    const folders = ['All', ...new Set(projects.map((project) => project.folder))];
    const education = [
      { title: 'Computer Engineering — Gachon University', detail: 'Currently studying Computer Engineering and building foundations in software development, web programming, and data science.' },
      { title: 'Web programming coursework', detail: 'Course projects include responsive web pages and React interfaces. Browse the project folders above for repository links.' },
      { title: 'Independent project practice', detail: 'Practicing frontend development, reusable React components, and Git/GitHub workflows through coursework and personal projects.' }
    ];

    function App() {
      const [theme, setTheme] = React.useState(() => localStorage.getItem('portfolio-theme') || 'dark');
      const [activeFolder, setActiveFolder] = React.useState('All');
      const [selectedProjectId, setSelectedProjectId] = React.useState(null);
      const [formStatus, setFormStatus] = React.useState('');
      const touchStart = React.useRef(null);
      const visibleProjects = activeFolder === 'All' ? projects : projects.filter((project) => project.folder === activeFolder);
      const selectedProject = visibleProjects.find((project) => project.id === selectedProjectId) || visibleProjects[0];
      const selectedIndex = Math.max(0, visibleProjects.findIndex((project) => project.id === selectedProject?.id));

      React.useEffect(() => {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('portfolio-theme', theme);
      }, [theme]);

      function chooseFolder(folder) {
        setActiveFolder(folder);
        const first = folder === 'All' ? projects[0] : projects.find((project) => project.folder === folder);
        setSelectedProjectId(first?.id || null);
      }
      function showProject(project) { setSelectedProjectId(project.id); }
      function moveProject(direction) {
        const nextIndex = (selectedIndex + direction + visibleProjects.length) % visibleProjects.length;
        setSelectedProjectId(visibleProjects[nextIndex].id);
      }
      function handleTouchStart(event) { touchStart.current = event.touches[0].clientX; }
      function handleTouchEnd(event) {
        if (touchStart.current === null) return;
        const distance = event.changedTouches[0].clientX - touchStart.current;
        if (Math.abs(distance) > 45 && visibleProjects.length > 1) moveProject(distance < 0 ? 1 : -1);
        touchStart.current = null;
      }
      function handleContactSubmit(event) {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const name = data.get('name').trim();
        const email = data.get('email').trim();
        const message = data.get('message').trim();
        const subject = encodeURIComponent(`Portfolio message from ${name}`);
        const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
        setFormStatus('Your email app should open with the message ready to send.');
        window.location.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
        event.currentTarget.reset();
      }

      return <div className="container">
        <nav aria-label="Main navigation">
          <a href="#top" className="nav-logo">murun<span>.dev</span></a>
          <div className="nav-links"><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#experience">Education</a><a href="#contact">Contact</a></div>
          <button className="theme-toggle" type="button" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} aria-label={`Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`}>{theme === 'dark' ? '☀ Light' : '☾ Dark'}</button>
        </nav>

        <header id="top">
          <div className="status-badge"><span className="status-dot"></span>Computer Engineering @ Gachon University</div>
          <h1>Otgonjargal Murun</h1>
          <p className="subtitle">Software Developer & Data Science Enthusiast</p>
          <p className="bio">Passionate Computer Engineering undergraduate building accessible web applications, data-driven tools, and responsive digital experiences with clean, maintainable code.</p>
          <div className="hero-actions"><a href="#projects" className="btn-primary">Explore Projects</a><a href="https://github.com/murun05" target="_blank" rel="noreferrer" className="btn-secondary">GitHub Profile</a></div>
        </header>

        <section id="skills">
          <div className="section-header"><h2>Skills & Technologies</h2><div className="section-line"></div></div>
          <div className="stats-grid">{stats.map((stat) => <div className="stat-card" key={stat.label}><span className="stat-value">{stat.value}</span><span className="stat-label">{stat.label}</span></div>)}</div>
          <div className="skills-grid">{skills.map((skill) => <article className="skill-card" key={skill.title}><h3>{skill.title}</h3><p>{skill.description}</p></article>)}</div>
        </section>

        <section id="projects">
          <div className="section-header"><h2>Project Folders</h2><div className="section-line"></div></div>
          <p style={{ color: 'var(--text-muted)', marginBottom: '1rem' }}>Choose a folder to browse its projects. Select a project below or swipe the featured card.</p>
          <div className="folders-grid" role="group" aria-label="Project folders">
            {folders.map((folder) => {
              const count = folder === 'All' ? projects.length : projects.filter((project) => project.folder === folder).length;
              return <button key={folder} className={`folder-card${activeFolder === folder ? ' selected' : ''}`} type="button" aria-pressed={activeFolder === folder} onClick={() => chooseFolder(folder)}>
                <span className="folder-icon-large" aria-hidden="true">{activeFolder === folder ? '📂' : '📁'}</span>
                <span className="folder-name">{folder === 'All' ? 'All Projects' : `${folder} Projects`}</span>
                <span className="folder-count">{count} {count === 1 ? 'project' : 'projects'}</span>
              </button>;
            })}
          </div>

          <div className="folder-heading"><h3>{activeFolder === 'All' ? 'All Projects' : `${activeFolder} Projects`}</h3><span>{visibleProjects.length} ITEM{visibleProjects.length === 1 ? '' : 'S'}</span></div>
          <div className="project-list" aria-label="Projects in selected folder">
            {visibleProjects.map((project) => <button key={project.id} type="button" className={`project-card${selectedProject?.id === project.id ? ' selected' : ''}`} aria-pressed={selectedProject?.id === project.id} onClick={() => showProject(project)}>
              <span className="project-folder-label">{project.folder} /</span><h4>{project.title}</h4><p>{project.description}</p><span className="project-tags">{project.tags.map((tag) => <span key={tag}>{tag}</span>)}</span>
            </button>)}
          </div>

          {selectedProject && <>
            <div className="carousel-viewport" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
              <div className="carousel-track" style={{ transform: `translateX(-${selectedIndex * 100}%)` }}>
                {visibleProjects.map((project, index) => <article className="project-slide" key={project.id} aria-label={`Project ${index + 1}: ${project.title}`}>
                  <div className="carousel-header"><span>{project.folder} / project</span><span>{String(index + 1).padStart(2, '0')} / {String(visibleProjects.length).padStart(2, '0')}</span></div>
                  <div className="project-hero"><div className="hero-mark" aria-hidden="true">{project.symbol}</div><h3>{project.title}</h3></div>
                  <div className="project-caption"><span>Selected work · {project.tags.slice(0, 2).join(' / ')}</span><span className="project-arrow" aria-hidden="true">↗</span></div>
                  <div className="project-slide-body"><h4>{project.title}</h4><p>{project.details}</p><div className="project-tags">{project.tags.map((tag) => <span key={tag}>{tag}</span>)}</div><div className="slide-actions"><a href={project.link} target="_blank" rel="noreferrer">View source ↗</a></div></div>
                </article>)}
              </div>
            </div>
            <div className="carousel-controls"><button className="arrow-btn" type="button" onClick={() => moveProject(-1)} aria-label="Previous project">←</button><span className="carousel-status">{String(selectedIndex + 1).padStart(2, '0')} / {String(visibleProjects.length).padStart(2, '0')}</span><button className="arrow-btn" type="button" onClick={() => moveProject(1)} aria-label="Next project">→</button></div>
            <div className="carousel-dots" aria-label="Choose featured project">{visibleProjects.map((project, index) => <button key={project.id} type="button" className={`carousel-dot${index === selectedIndex ? ' active' : ''}`} aria-label={`Show ${project.title}`} aria-pressed={index === selectedIndex} onClick={() => showProject(project)} />)}</div>
          </>}
        </section>

        <section id="experience">
          <div className="section-header"><h2>Experience & Education</h2><div className="section-line"></div></div>
          <div className="timeline">{education.map((item) => <details key={item.title}><summary>{item.title}</summary><p>{item.detail}</p></details>)}</div>
        </section>

        <section id="contact" className="contact-box">
          <h2>Let's Connect & Build Together</h2>
          <p>Have a project idea or want to collaborate? Send a message using the form below. It opens your email app so you can review and send it.</p>
          <form className="contact-form" onSubmit={handleContactSubmit}>
            <label>Your name<input name="name" type="text" autoComplete="name" placeholder="Your name" required maxLength="100" /></label>
            <label>Your email<input name="email" type="email" autoComplete="email" placeholder="you@example.com" required maxLength="254" /></label>
            <label>Message<textarea name="message" placeholder="What would you like to discuss?" required maxLength="2000"></textarea></label>
            <button className="btn-primary" type="submit">Prepare email</button>
            <p className="form-note">This form uses your device's email application; this website does not send or store your message.</p>
            <p className="form-status" role="status" aria-live="polite">{formStatus}</p>
          </form>
        </section>
        <footer><p>&copy; 2026 Otgonjargal Murun &bull; Built with React</p></footer>
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
