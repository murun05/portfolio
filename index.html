<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otgonjargal Murun | Computer Engineering Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-card-hover: rgba(30, 41, 59, 0.85);
            --primary: #3b82f6;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.4);
            --success: #34d399;
            --warning: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        a {
            text-decoration: none;
        }

        nav {
            position: sticky;
            top: 1rem;
            max-width: 960px;
            margin: 0 auto;
            padding: 0.85rem 1.75rem;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .nav-logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 1.75rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        header {
            text-align: center;
            padding: 5.5rem 1rem 4.5rem;
            animation: fadeUp 0.8s ease-out;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            border-radius: 999px;
            color: #67e8f9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22d3ee;
            border-radius: 50%;
            box-shadow: 0 0 8px #22d3ee;
        }

        header h1 {
            font-size: clamp(2.5rem, 5vw, 3.75rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p.subtitle {
            font-size: 1.25rem;
            font-weight: 500;
            color: #38bdf8;
            margin-bottom: 1.25rem;
        }

        header p.bio {
            max-width: 620px;
            margin: 0 auto 2.25rem;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            padding: 0.8rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.45);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            padding: 0.8rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        section {
            margin-bottom: 4rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-header h2 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-hover), transparent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            text-align: center;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .stat-card .value {
            display: block;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .skill-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 12px;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .skill-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .skill-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.35rem;
        }

        .skill-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin: 1.25rem 0 1.5rem;
        }

        .filter-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 0.9rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active,
        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--border-hover);
            background: rgba(59, 130, 246, 0.12);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.6);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .folder-icon {
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
        }

        .project-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .project-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }

        .tech-tags span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.9rem;
            transition: gap 0.2s ease, color 0.2s ease;
        }

        .project-link:hover {
            gap: 0.8rem;
            color: #7dd3fc;
        }

        .highlight-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .highlight-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.15rem 1.2rem;
        }

        .highlight-card .label {
            display: inline-block;
            color: var(--success);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .highlight-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.35rem;
        }

        .highlight-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .cta-box {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .cta-box h2 {
            font-size: 1.85rem;
            margin-bottom: 0.75rem;
        }

        .cta-box p {
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 1.75rem;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            nav {
                border-radius: 14px;
                padding: 0.75rem 1.25rem;
            }
            .nav-links {
                gap: 1rem;
            }
            header {
                padding: 3.5rem 0.5rem 3rem;
            }
            .project-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const skills = [
            { title: 'HTML5 & CSS3', description: 'Semantic markup, responsive layouts, CSS Grid & Flexbox' },
            { title: 'JavaScript (ES6+)', description: 'Interactive DOM manipulation, async APIs & modern logic' },
            { title: 'React', description: 'Component-driven UI, reusable interfaces & stateful interactions' },
            { title: 'Python & Data Science', description: 'Regression modeling, data analysis & statistical evaluation' },
            { title: 'Web Accessibility', description: 'WCAG standards, ARIA compliance & Lighthouse auditing' },
            { title: 'Git & Version Control', description: 'Branching workflows, pull requests & GitHub collaboration' }
        ];

        const stats = [
            { value: '3+', label: 'Years Learning' },
            { value: '12+', label: 'Projects' },
            { value: '100%', label: 'Curiosity' }
        ];

        const projectCategories = ['All', 'Web', 'React', 'Data'];

        const projects = [
            {
                folder: '/web-pro',
                title: 'Web Programming Repository',
                description: 'Web programming coursework and responsive applications built with pure HTML5, native CSS3, and WCAG-compliant accessible web standards.',
                tags: ['HTML5', 'CSS3', 'JavaScript', 'Accessibility'],
                link: 'https://github.com/murun05/web-pro',
                category: 'Web'
            },
            {
                folder: '/week11-task11',
                title: 'Week 11 React Interface',
                description: 'A React-based student directory app with reusable component cards, custom styling, and an elegant responsive layout for portfolio showcase.',
                tags: ['React', 'Components', 'UI Design', 'JavaScript'],
                link: 'https://github.com/murun05/week11-task11',
                category: 'React'
            },
            {
                folder: '/project',
                title: 'Data-Driven Project',
                description: 'A project focused on practical application, structured problem solving, and modern frontend tooling to turn ideas into interactive digital products.',
                tags: ['TypeScript', 'UI', 'Architecture', 'Product'],
                link: 'https://github.com/murun05/project',
                category: 'Data'
            }
        ];

        const highlights = [
            {
                label: 'Current focus',
                title: 'Frontend + web applications',
                detail: 'Building responsive interfaces with clear structure and user-friendly interaction patterns.'
            },
            {
                label: 'Learning',
                title: 'React and modern UI engineering',
                detail: 'Improving reusable components, app state, and component-driven design thinking.'
            },
            {
                label: 'Goal',
                title: 'Portfolio that shows practical work',
                detail: 'Turning course projects into a presentation-ready portfolio for future opportunities.'
            }
        ];

        function SkillCard({ title, description }) {
            return (
                <div className="skill-card">
                    <div className="skill-title">{title}</div>
                    <div className="skill-desc">{description}</div>
                </div>
            );
        }

        function StatCard({ value, label }) {
            return (
                <div className="stat-card">
                    <span className="value">{value}</span>
                    <span className="label">{label}</span>
                </div>
            );
        }

        function ProjectCard({ folder, title, description, tags, link }) {
            return (
                <div className="project-card">
                    <div>
                        <div className="project-top">
                            <span className="folder-icon">{folder}</span>
                        </div>
                        <h3>{title}</h3>
                        <p>{description}</p>
                        <div className="tech-tags">
                            {tags.map((tag) => (
                                <span key={tag}>{tag}</span>
                            ))}
                        </div>
                    </div>
                    <a href={link} className="project-link" target="_blank" rel="noreferrer">
                        View Repository <span aria-hidden="true">&rarr;</span>
                    </a>
                </div>
            );
        }

        function App() {
            const [activeFilter, setActiveFilter] = React.useState('All');

            const filteredProjects =
                activeFilter === 'All'
                    ? projects
                    : projects.filter((project) => project.category === activeFilter);

            return (
                <div className="container">
                    <nav>
                        <a href="#" className="nav-logo">murun<span>.dev</span></a>
                        <div className="nav-links">
                            <a href="#skills">Skills</a>
                            <a href="#projects">Projects</a>
                            <a href="https://github.com/murun05" target="_blank" rel="noreferrer">GitHub ↗</a>
                        </div>
                    </nav>

                    <header>
                        <div className="status-badge">
                            <span className="status-dot"></span>
                            Computer Engineering @ Gachon University
                        </div>
                        <h1>Otgonjargal Murun</h1>
                        <p className="subtitle">Software Developer & Data Science Enthusiast</p>
                        <p className="bio">
                            Passionate Computer Engineering undergraduate building accessible web applications,
                            data-driven tools, and responsive digital experiences with clean, maintainable code.
                        </p>
                        <div className="hero-actions">
                            <a href="#projects" className="btn-primary">Explore Projects</a>
                            <a href="https://github.com/murun05" target="_blank" rel="noreferrer" className="btn-secondary">GitHub Profile</a>
                        </div>
                    </header>

                    <section id="skills">
                        <div className="section-header">
                            <h2>Skills & Technologies</h2>
                            <div className="section-line"></div>
                        </div>

                        <div className="stats-grid">
                            {stats.map((stat) => (
                                <StatCard key={stat.label} value={stat.value} label={stat.label} />
                            ))}
                        </div>

                        <div className="skills-grid">
                            {skills.map((skill) => (
                                <SkillCard
                                    key={skill.title}
                                    title={skill.title}
                                    description={skill.description}
                                />
                            ))}
                        </div>
                    </section>

                    <section id="projects">
                        <div className="section-header">
                            <h2>Course & Featured Projects</h2>
                            <div className="section-line"></div>
                        </div>

                        <div className="filter-bar" aria-label="Project filters">
                            {projectCategories.map((category) => (
                                <button
                                    key={category}
                                    type="button"
                                    className={category === activeFilter ? 'filter-btn active' : 'filter-btn'}
                                    onClick={() => setActiveFilter(category)}
                                >
                                    {category}
                                </button>
                            ))}
                        </div>

                        <div className="projects-grid">
                            {filteredProjects.map((project) => (
                                <ProjectCard
                                    key={project.title}
                                    folder={project.folder}
                                    title={project.title}
                                    description={project.description}
                                    tags={project.tags}
                                    link={project.link}
                                />
                            ))}
                        </div>
                    </section>

                    <section>
                        <div className="section-header">
                            <h2>Portfolio Highlights</h2>
                            <div className="section-line"></div>
                        </div>

                        <div className="highlight-grid">
                            {highlights.map((item) => (
                                <div className="highlight-card" key={item.title}>
                                    <span className="label">{item.label}</span>
                                    <h3>{item.title}</h3>
                                    <p>{item.detail}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section className="cta-box">
                        <h2>Let's Connect & Build Together</h2>
                        <p>
                            Always open to collaborating on software engineering projects, web development, or data science coursework.
                        </p>
                        <a href="https://github.com/murun05" target="_blank" rel="noreferrer" className="btn-primary">Follow on GitHub</a>
                    </section>

                    <footer>
                        <p>&copy; 2026 Otgonjargal Murun &bull; Built for Git & Version Control Course</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
